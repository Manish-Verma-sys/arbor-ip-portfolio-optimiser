name: Temporary live patent-rating smoke test

on:
  push:
    branches: [staging]
    paths:
      - ".github/workflows/patent-rating-smoke.yml"

permissions:
  contents: read

jobs:
  live-patent-rating-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check staging AI configuration
        env:
          API: https://portfolio-maintenance-calculator-staging.onrender.com
        run: |
          set -euo pipefail
          curl -fsS "$API/healthz" | tee /tmp/health.json
          echo
          curl -fsS "$API/v1/ai/status" | jq '{configured, model, key_type: .key.type, key_looks_valid: .key.looks_valid}' | tee /tmp/ai-status.json

      - name: Run three US patent cases and report ratings plus rationales
        env:
          API: https://portfolio-maintenance-calculator-staging.onrender.com
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 -X POST "$API/v1/patent-analyses" \
            -H 'Content-Type: application/json' -H 'x-user-id: u_ipm' \
            --data '{"numbers":"US10055028B2\nUS10491048B2\nUS8771945B1","name":"Temporary prompt quality smoke test","entity_size":"large"}' \
            | tee /tmp/start.json
          echo
          SID="$(jq -r '.search_id // empty' /tmp/start.json)"
          test -n "$SID"
          echo "Created search: $SID"
          STATUS=""
          for i in $(seq 1 180); do
            curl -fsS "$API/v1/portfolio-searches/$SID" -H 'x-user-id: u_ipm' > /tmp/search.json
            STATUS="$(jq -r '.status // "UNKNOWN"' /tmp/search.json)"
            PROGRESS="$(jq -r '.progress // 0' /tmp/search.json)"
            echo "Poll $i: status=$STATUS progress=$PROGRESS%"
            case "$STATUS" in
              REVIEW_READY|PARTIAL|FAILED) break ;;
            esac
            sleep 5
          done
          echo "=== Search status and diagnostic messages ==="
          jq '{status, progress, error, portfolio_id, messages: [.messages[]?.msg]}' /tmp/search.json
          if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "UNKNOWN" ]; then
            exit 2
          fi
          PID="$(jq -r '.portfolio_id // empty' /tmp/search.json)"
          test -n "$PID"
          curl -fsS "$API/v1/portfolios/$PID" -H 'x-user-id: u_ipm' > /tmp/portfolio.json
          RID="$(jq -r '.latest_score_run_id // empty' /tmp/portfolio.json)"
          test -n "$RID"
          curl -fsS "$API/v1/score-runs/$RID/results?page_size=20" -H 'x-user-id: u_ipm' > /tmp/results.json
          echo "=== Summary: model mode, coverage and unknown scores ==="
          jq --arg mode "$(jq -r '.data_mode' /tmp/portfolio.json)" '
            {mode: $mode, total: .total,
             patents: [.items[] | {
               patent: .publication_number, title: .title, score: .strategic_score,
               coverage: .data_coverage, evidence_confidence: .evidence_confidence,
               unknown_dimensions: ([.ratings[] | select(. == null)] | length),
               ratings: .ratings
             }]}
          ' /tmp/results.json | tee /tmp/summary.json
          echo "=== Full per-dimension rationales (inspect for specificity and evidence) ==="
          jq -r '.items[] |
            "### \(.publication_number) — \(.title)\nscore=\(.strategic_score) coverage=\(.data_coverage) confidence=\(.evidence_confidence)\n" +
            ([ "commercial","claim_quality","competitive","strategic","portfolio","licensing","future" |
               . as $d |
               ($d + " = " + ((.ratings[$d] // "NULL")|tostring) + "/5\n" + (.dimension_details[$d].rationale // "NO RATIONALE") + "\n")
             ] | join("\n"))
          ' /tmp/results.json | tee /tmp/rationales.txt
          echo "=== Basic quality checks ==="
          jq -n --slurpfile p /tmp/portfolio.json --slurpfile r /tmp/results.json '
            ($r[0].items) as $rows |
            {all_3_patents_returned: ($rows|length == 3),
             each_has_7_dimension_keys: ([$rows[].ratings|keys|length]|all(. == 7)),
             total_unknown_dimensions: ([$rows[].ratings[]|select(. == null)]|length),
             short_rationales_under_80_chars: ([$rows[].dimension_details[]?.rationale // "" | select(length < 80)]|length),
             rationale_lengths: ([$rows[] as $row | $row.dimension_details | to_entries[] | {patent:$row.publication_number, dimension:.key, chars:(.value.rationale // ""|length)}])
            }' | tee /tmp/quality-checks.json
          cat /tmp/quality-checks.json
          echo "=== Artifacts ==="
          echo "Outputs: /tmp/summary.json /tmp/rationales.txt /tmp/quality-checks.json"
          if [ "$(jq -r '.all_3_patents_returned' /tmp/quality-checks.json)" != "true" ]; then exit 3; fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patent-rating-smoke-report
          path: |
            /tmp/health.json
            /tmp/ai-status.json
            /tmp/search.json
            /tmp/portfolio.json
            /tmp/results.json
            /tmp/summary.json
            /tmp/rationales.txt
            /tmp/quality-checks.json
          if-no-files-found: ignore
