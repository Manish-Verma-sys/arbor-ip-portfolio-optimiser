services:
  - type: web
    name: arbor-ip
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Optional: point at a Render Postgres instance for durable reviews/audit.
      # - key: DATABASE_URL
      #   fromDatabase: { name: arbor-ip-db, property: connectionString }
